AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ContratR.ai v3 — FTR Ready
  Auditor de Contratos Multi-Tenant com IA AWS
  Well-Architected: 5 pilares cobertos

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  AllowedOrigin:
    Type: String
    Default: '*'
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
  JwtSecret:
    Type: String
    Default: contratr-ai-secret-2026-challenge
    NoEcho: true
  AlarmEmail:
    Type: String
    Default: ''
    Description: E-mail para alarmes (deixe vazio para desabilitar)

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256
    Architectures:
      - arm64
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        ANALYSIS_TABLE: !Ref AnalysisTable
        COMPANIES_TABLE: !Ref CompaniesTable
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        JWT_SECRET: !Ref JwtSecret
        LOG_LEVEL: INFO
        POWERTOOLS_SERVICE_NAME: contratr-ai
    Tags:
      Project: contratr-ai
      Environment: !Ref Environment
      ManagedBy: SAM

Resources:

  # ════════════════════════════════════════
  # PILAR: CONFIABILIDADE — DLQ para Lambdas assíncronas
  # ════════════════════════════════════════
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'contratr-ai-dlq-${Environment}'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # ════════════════════════════════════════
  # PILAR: EXCELÊNCIA OPERACIONAL — SNS para alarmes
  # ════════════════════════════════════════
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      TopicName: !Sub 'contratr-ai-alarms-${Environment}'

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # ════════════════════════════════════════
  # S3 — Armazenamento de PDFs
  # ════════════════════════════════════════
  ContractsBucket:
    Type: AWS::S3::Bucket
    DependsOn: TextractInvokePermission
    Properties:
      BucketName: !Sub 'contratr-ai-contracts-${Environment}-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AutoDeleteUploads
            Status: Enabled
            ExpirationInDays: 30
            Prefix: uploads/
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [PUT]
            AllowedOrigins: [!Ref AllowedOrigin]
            MaxAge: 3600
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt TextractProcessorFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
                  - Name: suffix
                    Value: .pdf

  ContractsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ContractsBucket
      PolicyDocument:
        Statement:
          - Sid: DenyUnencryptedUploads
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${ContractsBucket.Arn}/*'
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: AES256
          - Sid: DenyNonHttps
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub '${ContractsBucket.Arn}'
              - !Sub '${ContractsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  TextractInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TextractProcessorFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # ════════════════════════════════════════
  # DynamoDB — Análises
  # ════════════════════════════════════════
  AnalysisTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'contratr-ai-analysis-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: analysis_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: analysis_id
          KeyType: HASH
        - AttributeName: created_at
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ════════════════════════════════════════
  # DynamoDB — Empresas + Políticas
  # ════════════════════════════════════════
  CompaniesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'contratr-ai-companies-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: company_id
          AttributeType: S
      KeySchema:
        - AttributeName: company_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ════════════════════════════════════════
  # API Gateway
  # ════════════════════════════════════════
  ContratRAIApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'contratr-ai-api-${Environment}'
      StageName: !Ref Environment
      TracingEnabled: true
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
          LoggingLevel: ERROR
          DataTraceEnabled: false
          MetricsEnabled: true

  # ════════════════════════════════════════
  # Lambda Layer
  # ════════════════════════════════════════
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub 'contratr-ai-common-${Environment}'
      Description: Utilitarios compartilhados v3
      ContentUri: ../backend/layers/common/
      CompatibleRuntimes:
        - python3.12

  # ════════════════════════════════════════
  # LAMBDAS
  # ════════════════════════════════════════

  AuthLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'contratr-ai-auth-login-${Environment}'
      Handler: handler.lambda_handler
      CodeUri: ../backend/lambdas/auth_login/
      Description: Login do operador master (JWT)
      Layers:
        - !Ref CommonLayer
      Events:
        Login:
          Type: Api
          Properties:
            RestApiId: !Ref ContratRAIApi
            Path: /auth/login
            Method: POST

  CompaniesCrudFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'contratr-ai-companies-${Environment}'
      Handler: handler.lambda_handler
      CodeUri: ../backend/lambdas/companies_crud/
      Description: CRUD de empresas
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CompaniesTable
      Events:
        ListCreate:
          Type: Api
          Properties:
            RestApiId: !Ref ContratRAIApi
            Path: /companies
            Method: ANY
        GetUpdateDelete:
          Type: Api
          Properties:
            RestApiId: !Ref ContratRAIApi
            Path: /companies/{company_id}
            Method: ANY

  PoliciesCrudFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'contratr-ai-policies-${Environment}'
      Handler: handler.lambda_handler
      CodeUri: ../backend/lambdas/policies_crud/
      Description: CRUD de politicas por empresa
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CompaniesTable
      Events:
        AddPolicy:
          Type: Api
          Properties:
            RestApiId: !Ref ContratRAIApi
            Path: /companies/{company_id}/policies
            Method: POST
        ManagePolicy:
          Type: Api
          Properties:
            RestApiId: !Ref ContratRAIApi
            Path: /companies/{company_id}/policies/{policy_id}
            Method: ANY

  UploadProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'contratr-ai-upload-${Environment}'
      Handler: handler.lambda_handler
      CodeUri: ../backend/lambdas/upload_processor/
      Description: Valida PDF e gera presigned URL
      Environment:
        Variables:
          CONTRACTS_BUCKET: !Sub 'contratr-ai-contracts-${Environment}-${AWS::AccountId}'
      Layers:
        - !Ref CommonLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource: !Sub 'arn:aws:s3:::contratr-ai-contracts-${Environment}-${AWS::AccountId}/*'
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysisTable
      Events:
        Upload:
          Type: Api
          Properties:
            RestApiId: !Ref ContratRAIApi
            Path: /contracts/upload
            Method: POST

  TextractProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'contratr-ai-textract-${Environment}'
      Handler: handler.lambda_handler
      CodeUri: ../backend/lambdas/textract_processor/
      Description: Extrai texto via Textract
      Timeout: 300
      MemorySize: 512
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt DeadLetterQueue.Arn
      Environment:
        Variables:
          CONTRACTS_BUCKET: !Sub 'contratr-ai-contracts-${Environment}-${AWS::AccountId}'
      Layers:
        - !Ref CommonLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub 'arn:aws:s3:::contratr-ai-contracts-${Environment}-${AWS::AccountId}/*'
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysisTable
        - Statement:
            - Effect: Allow
              Action: [textract:DetectDocumentText, textract:AnalyzeDocument, textract:StartDocumentTextDetection, textract:GetDocumentTextDetection]
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:contratr-ai-comprehend-${Environment}'
        - SQSSendMessagePolicy:
            QueueName: !GetAtt DeadLetterQueue.QueueName

  ComprehendAnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'contratr-ai-comprehend-${Environment}'
      Handler: handler.lambda_handler
      CodeUri: ../backend/lambdas/comprehend_analyzer/
      Description: Extrai entidades via Comprehend
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt DeadLetterQueue.Arn
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysisTable
        - Statement:
            - Effect: Allow
              Action: [comprehend:DetectEntities, comprehend:DetectKeyPhrases, comprehend:DetectSentiment]
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:contratr-ai-bedrock-${Environment}'
        - SQSSendMessagePolicy:
            QueueName: !GetAtt DeadLetterQueue.QueueName

  BedrockAnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'contratr-ai-bedrock-${Environment}'
      Handler: handler.lambda_handler
      CodeUri: ../backend/lambdas/bedrock_analyzer/
      Description: Analise juridica com politicas via Bedrock
      Timeout: 180
      MemorySize: 512
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt DeadLetterQueue.Arn
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysisTable
        - DynamoDBReadPolicy:
            TableName: !Ref CompaniesTable
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub '*'
        - SQSSendMessagePolicy:
            QueueName: !GetAtt DeadLetterQueue.QueueName

  GetAnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'contratr-ai-get-analysis-${Environment}'
      Handler: handler.lambda_handler
      CodeUri: ../backend/lambdas/get_analysis/
      Description: Retorna resultado da analise
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AnalysisTable
      Events:
        GetAnalysis:
          Type: Api
          Properties:
            RestApiId: !Ref ContratRAIApi
            Path: /contracts/{analysis_id}
            Method: GET

  # ── Analysis History ──
  AnalysisHistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'contratr-ai-history-${Environment}'
      Handler: handler.lambda_handler
      CodeUri: ../backend/lambdas/analysis_history/
      Description: Historico de analises por empresa
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AnalysisTable
      Events:
        History:
          Type: Api
          Properties:
            RestApiId: !Ref ContratRAIApi
            Path: /companies/{company_id}/analyses
            Method: GET

  # ── Policies Bulk Import ──
  PoliciesBulkFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'contratr-ai-policies-bulk-${Environment}'
      Handler: handler.lambda_handler
      CodeUri: ../backend/lambdas/policies_bulk/
      Description: Import bulk de politicas via IA
      Timeout: 300
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CompaniesTable
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: '*'
      Events:
        BulkImport:
          Type: Api
          Properties:
            RestApiId: !Ref ContratRAIApi
            Path: /companies/{company_id}/policies/bulk
            Method: POST

  # ── Public Demo ──
  PublicDemoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'contratr-ai-demo-${Environment}'
      Handler: handler.lambda_handler
      CodeUri: ../backend/lambdas/public_demo/
      Description: Rota publica para demo e testes
      Environment:
        Variables:
          CONTRACTS_BUCKET: !Sub 'contratr-ai-contracts-${Environment}-${AWS::AccountId}'
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysisTable
        - Statement:
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource: !Sub 'arn:aws:s3:::contratr-ai-contracts-${Environment}-${AWS::AccountId}/*'
      Events:
        DemoInfo:
          Type: Api
          Properties:
            RestApiId: !Ref ContratRAIApi
            Path: /demo/info
            Method: GET
        DemoSteps:
          Type: Api
          Properties:
            RestApiId: !Ref ContratRAIApi
            Path: /demo/steps
            Method: GET
        DemoAnalyze:
          Type: Api
          Properties:
            RestApiId: !Ref ContratRAIApi
            Path: /demo/analyze
            Method: POST

  # ── External API ──
  ExternalApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'contratr-ai-external-api-${Environment}'
      Handler: handler.lambda_handler
      CodeUri: ../backend/lambdas/api_external/
      Description: API externa para integracao com outros sistemas
      Environment:
        Variables:
          CONTRACTS_BUCKET: !Sub 'contratr-ai-contracts-${Environment}-${AWS::AccountId}'
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysisTable
        - Statement:
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource: !Sub 'arn:aws:s3:::contratr-ai-contracts-${Environment}-${AWS::AccountId}/*'
      Events:
        GetExtAnalysis:
          Type: Api
          Properties:
            RestApiId: !Ref ContratRAIApi
            Path: /api/v1/analysis/{analysis_id}
            Method: GET
        StartExtAnalysis:
          Type: Api
          Properties:
            RestApiId: !Ref ContratRAIApi
            Path: /api/v1/analyze
            Method: POST

  # ════════════════════════════════════════
  # PILAR: EXCELÊNCIA OPERACIONAL — Alarmes CloudWatch
  # ════════════════════════════════════════
  DLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmName: !Sub 'contratr-ai-dlq-messages-${Environment}'
      AlarmDescription: Mensagens na DLQ indicam falhas no pipeline
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmTopic

  BedrockErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmName: !Sub 'contratr-ai-bedrock-errors-${Environment}'
      AlarmDescription: Erros na Lambda do Bedrock
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref BedrockAnalyzerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmTopic

Outputs:
  ApiUrl:
    Description: URL da API
    Value: !Sub 'https://${ContratRAIApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  ContractsBucketName:
    Value: !Ref ContractsBucket
  AnalysisTableName:
    Value: !Ref AnalysisTable
  CompaniesTableName:
    Value: !Ref CompaniesTable
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
    Description: DLQ para mensagens de falha do pipeline
